[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videorescue"
dynamic = ["version"]
description = "Reparador local de videos dañados (MP4, MOV, AVI, H.264/H.265)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Juan Antonio Bedmar González" }]
dependencies = ["flask", "imageio-ffmpeg"]

[project.optional-dependencies]
desktop = ["pywebview"]
build = ["pywebview", "pyinstaller", "pillow"]
dev = ["pytest"]

[project.scripts]
videorescue = "videorescue.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "videorescue.__version__" }

[tool.setuptools.packages.find]
include = ["videorescue*"]

[tool.setuptools.package-data]
videorescue = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
