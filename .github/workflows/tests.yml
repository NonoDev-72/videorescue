name: Tests

on:
  # Los cambios solo de documentación o imágenes no ejecutan nada
  pull_request:
    paths-ignore: ["**.md", "assets/**", "LICENSE", "NOTICE", ".gitignore"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "assets/**", "LICENSE", "NOTICE", ".gitignore"]

permissions:
  contents: read

jobs:
  test:
    # Las PRs de forks no ejecutan nada: solo se ejecuta código del propio repositorio
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    name: pytest (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
